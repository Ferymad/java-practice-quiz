<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Fundamentals Quiz</title>
<style>
:root {
  --teal:#245da8; --dark:#173c66; --ink:#233247; --muted:#53667c;
  --border:#c6d2e1; --paper:#fff; --bg:#e8eef5; --warn:#986508;
  --selection:#e6effc; --soft:#f4f7fb;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 'Avenir Next',Avenir,'Segoe UI',sans-serif; }
button,select,input { font:inherit; }
button,select { min-height:44px; max-width:100%; border:1px solid #a6b6ca; border-radius:7px; color:var(--ink); background:white; padding:9px 15px; }
button { cursor:pointer; font-weight:600; }
button:hover { background:#edf3fc; border-color:var(--teal); }
button:disabled { opacity:.45; cursor:default; }
button.primary { background:var(--teal); border-color:var(--teal); color:white; }
button.primary:hover { background:var(--dark); }
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid #986508; outline-offset:3px; }
input { accent-color:var(--teal); }
header { min-height:84px; background:white; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px max(24px,calc((100vw - 1320px)/2)); }
header strong { color:var(--dark); font-size:19px; font-weight:700; }
header p { font-size:14px; color:var(--muted); margin:0; }
.brand { display:flex; align-items:center; gap:14px; }
.brand-mark { width:40px; height:40px; border:1.5px solid var(--teal); border-radius:9px; display:grid; place-items:center; font:700 20px Menlo,Consolas,monospace; color:var(--teal); }
.header-note { font-size:14px; color:var(--muted); }
main { max-width:1320px; margin:32px auto; padding:0 24px 56px; }
h1,h2,h3,p { margin-top:0; }
h1 { font-size:30px; font-weight:700; line-height:1.2; letter-spacing:-.7px; margin-bottom:18px; color:var(--dark); }
h2 { font-size:21px; line-height:1.35; margin-bottom:16px; color:var(--dark); }
h3 { font-size:16px; line-height:1.5; margin-bottom:8px; }
p { margin-bottom:14px; }
.panel > p:not(.score) { max-width:74ch; }
.panel { min-width:0; background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:32px; }
.setup { max-width:none; padding:0; overflow:hidden; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr); }
.setup-main { padding:48px; }
.setup h1 { font-size:clamp(32px,4vw,48px); letter-spacing:-1.5px; max-width:15ch; margin:0 0 22px; }
.setup-lead { font-size:18px; max-width:52ch; line-height:1.6; }
.setup-note { max-width:62ch; }
.paper-outline { background:var(--soft); border-left:1px solid var(--border); padding:38px 32px; }
.paper-outline h2 { font-size:20px; margin-bottom:6px; }
.paper-outline table { font-size:14px; margin:22px 0 12px; }
.paper-outline th,.paper-outline td { padding:11px 5px; background:transparent; vertical-align:top; }
.paper-outline td:first-child { white-space:nowrap; color:var(--dark); font-weight:600; }
.paper-outline th:last-child,.paper-outline td:last-child { text-align:right; }
.paper-outline caption { caption-side:bottom; text-align:left; color:var(--muted); padding-top:16px; }
.setup-facts { color:var(--dark); font-weight:600; display:flex; gap:12px 24px; flex-wrap:wrap; margin:22px 0 30px; padding:14px 0; border-block:1px solid var(--border); }
.mode-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.mode { display:flex; align-items:flex-start; gap:10px; border:1px solid var(--border); border-radius:8px; padding:16px; cursor:pointer; }
.mode:has(input:checked) { border-color:var(--teal); background:var(--selection); }
.mode input { margin-top:6px; }
.mode strong,.mode small { display:block; }
.mode small { font-size:13px; color:var(--muted); margin-top:3px; font-weight:400; }
.setup details { font-size:14px; color:var(--muted); margin-top:26px; }
.setup details p { margin-top:10px; max-width:65ch; }
summary { cursor:pointer; color:var(--dark); }
.actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:24px; }
.muted,.tag { font-size:14px; color:var(--muted); }
.notice { padding:14px 18px; background:#fff7df; border:1px solid #c39d49; border-radius:8px; color:#66450c; margin-bottom:20px; }
.workspace { display:grid; grid-template-columns:minmax(0,1fr) 278px; align-items:start; gap:24px; }
.workspace > aside { position:sticky; top:24px; padding:24px; max-height:calc(100dvh - 48px); overflow-y:auto; scrollbar-width:thin; }
h1[tabindex="-1"]:focus { outline:none; }
.question-head { display:flex; align-items:start; justify-content:space-between; gap:20px; border-bottom:1px solid var(--border); padding-bottom:22px; margin-bottom:26px; }
.question-head h1 { margin-bottom:0; }
.question-head .tag { margin-bottom:8px; }
.question-head button { font-size:14px; white-space:nowrap; }
.question-head button[aria-pressed=true] { background:#fff5d9; color:#75500b; border-color:#bd9747; }
.prompt { max-width:74ch; white-space:pre-wrap; overflow-wrap:anywhere; }
pre { max-width:100%; overflow:auto; background:var(--soft); border:1px solid var(--border); border-radius:8px; margin:24px 0; padding:16px 0; font:14px/1.9 Menlo,Consolas,monospace; tab-size:4; }
.code-line { display:block; min-width:max-content; padding:0 20px 0 56px; position:relative; min-height:27px; }
.code-line::before { content:attr(data-line); position:absolute; left:0; width:36px; text-align:right; color:#5b6d85; font-size:11px; user-select:none; }
.code-blank { min-height:27px; padding:0 7px; margin:0 2px; border:1px solid #7398c9; border-radius:4px; background:#e7effc; color:#173c66; font:inherit; line-height:1.7; vertical-align:baseline; }
.code-blank.filled { background:#dceafc; border-color:var(--teal); }
fieldset { min-width:0; border:0; margin:20px 0; padding:0; }
legend { padding:0; margin-bottom:12px; font-weight:600; overflow-wrap:anywhere; }
.radio { display:flex; gap:14px; align-items:center; min-height:54px; padding:12px 16px; border:1px solid var(--border); border-radius:7px; margin-bottom:10px; cursor:pointer; }
.radio:hover { border-color:#789ac4; background:var(--soft); }
.radio:has(input:checked) { border-color:var(--teal); background:var(--selection); }
.radio input { flex-shrink:0; }
.radio span { overflow-wrap:anywhere; }
.answer-instructions { margin-top:26px; font-size:14px; color:var(--muted); max-width:70ch; }
.field { border-top:1px solid var(--border); padding-top:20px; margin-top:24px; }
.field legend { float:left; width:100%; margin-bottom:12px; }
.field::after { content:''; display:table; clear:both; }
.bank { clear:both; display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
.token { font:13px/1.5 Menlo,Consolas,monospace; overflow-wrap:anywhere; text-align:left; padding:8px 11px; border-radius:5px; min-height:38px; background:var(--soft); }
.token[aria-pressed=true] { color:white; background:var(--dark); border-color:var(--dark); }
.slot { clear:both; display:block; text-align:left; width:100%; border:1px dashed #829bb9; background:#fafcff; color:var(--muted); margin-bottom:10px; overflow-wrap:anywhere; font-weight:400; }
.slot.filled { border-style:solid; color:var(--dark); background:var(--selection); font-weight:600; }
.select-label { display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; }
.field select { width:100%; font-size:14px; }
.answer-tools { border-top:1px solid var(--border); padding-top:18px; }
.question-actions { border-top:1px solid var(--border); padding-top:20px; justify-content:space-between; }
aside h2 { font-size:18px; }
.timer { color:var(--dark); font-weight:600; font-size:36px; letter-spacing:-1px; font-variant-numeric:tabular-nums; line-height:1.2; margin:5px 0 20px; }
.timer.urgent { color:#9b3e28; }
.attempt-progress { margin-bottom:22px; }
.attempt-progress progress { display:block; width:100%; height:6px; border:0; border-radius:3px; accent-color:var(--teal); margin-top:10px; }
.attempt-progress progress::-webkit-progress-bar { background:#e4ebf4; border-radius:3px; }
.attempt-progress progress::-webkit-progress-value { background:var(--teal); border-radius:3px; }
.navgrid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:18px 0; }
.navgrid button { position:relative; padding:5px 1px; min-height:38px; border-radius:5px; font-size:14px; font-weight:500; }
.navgrid .answered { background:#dce9fc; border-color:#7b9ec9; color:var(--dark); }
.navgrid .partial { background:linear-gradient(to top,#dce9fc 50%,white 50%); border-color:#7b9ec9; }
.navgrid [aria-current=true] { outline:2px solid var(--teal); outline-offset:2px; font-weight:700; }
.navgrid .flagged::after { content:'⚑'; position:absolute; right:0; top:-9px; color:#805000; font-size:17px; }
.legend-list { font-size:12px; color:var(--muted); line-height:1.7; }
.sidebar-finish { width:100%; margin-top:16px; }
.mobile-review { display:none; }
.facts { display:flex; flex-wrap:wrap; gap:14px 26px; border-block:1px solid var(--border); padding:16px 0; margin:24px 0; }
.summary-list { list-style:none; padding:0; }
.summary-list li { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--border); }
.summary-list li span { color:var(--muted); font-size:14px; }
.topline { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; }
.score { color:var(--dark); font-size:32px; font-weight:600; margin:12px 0; font-variant-numeric:tabular-nums; }
.review { margin-top:24px; }
.review > h2 { padding-bottom:18px; border-bottom:1px solid var(--border); }
.review-field { border-top:1px solid var(--border); padding:20px 0 6px; overflow-wrap:anywhere; }
.review-field p { max-width:74ch; }
.correct { color:#226248; }
.incorrect { color:#9b3e28; }
.source { font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; }
table { width:100%; border-collapse:collapse; margin:16px 0; }
th,td { text-align:left; padding:12px; border-bottom:1px solid var(--border); overflow-wrap:anywhere; }
th { color:var(--dark); background:var(--soft); font-weight:600; }
.table-wrap { overflow-x:auto; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
@media(min-width:801px) { .radio { max-width:600px; } }
@media(max-width:1000px) { .setup-main { padding:32px; } .paper-outline { padding:30px 24px; } }
@media(max-width:800px) {
  header { padding:16px 20px; min-height:76px; } .header-note { display:none; }
  main { margin:20px auto; padding:0 16px 36px; }
  .setup { grid-template-columns:1fr; } .setup-main { padding:28px; }
  .paper-outline { border-left:0; border-top:1px solid var(--border); padding:28px; }
  .setup h1 { max-width:20ch; font-size:36px; }
  .workspace { display:flex; flex-direction:column; gap:18px; }
  .workspace > .panel { width:100%; }
  .workspace > aside { position:static; order:-1; padding:16px 20px; max-height:none; overflow:visible; }
  aside h2,.legend-list,aside .sidebar-finish { display:none; }
  .timer { font-size:24px; margin:0; }
  .time-block { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .attempt-progress { margin:10px 0 0; font-size:13px; }
  .mobile-review { display:block; width:100%; margin-top:14px; }
  .nav-details { margin-top:12px; } .nav-details summary { font-size:14px; }
  .navgrid { grid-template-columns:repeat(7,minmax(0,1fr)); }
  .navgrid button { min-height:44px; }
  .panel:not(.setup) { padding:24px; border-radius:10px; }
  .question-head { flex-wrap:wrap; gap:14px; padding-bottom:18px; margin-bottom:20px; }
  .question-head h1 { font-size:26px; }
  .question-head button { min-height:44px; }
  .prompt { font-size:15px; }
  pre { font-size:12px; margin:20px -9px; max-width:calc(100% + 18px); }
  .code-line { padding-right:16px; padding-left:42px; } .code-line::before { width:27px; }
  .token { min-height:44px; }
  th,td { padding:10px 8px; font-size:14px; }
}
@media(min-width:801px) { .nav-details > summary { display:none; } .nav-details:not([open]) > :not(summary) { display:block; } .nav-details:not([open]) > .navgrid { display:grid; } }
@media(max-width:430px) { .mode-options { grid-template-columns:1fr; } .setup-main,.paper-outline { padding:24px; } header strong { font-size:17px; } .panel:not(.setup) { padding:20px; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important; } }
@media print { header,button,.bank,aside,#storage-notice { display:none; } body { background:white; font-size:12pt; } .panel { border:0; } main { max-width:none; } .review { break-inside:avoid; } .code-line { padding-left:0; } .code-line::before { display:none; } }

</style>
</head>

ned integral primitive type (byte, short, int or long) that can store the mathematical integer 4500000000. This is a range question, not a Java-literal declaration.", "code": "", "fields": [{"label": "Select one", "answer": "long", "options": ["int", "long", "short", "byte"], "explanation": "4500000000 exceeds int maximum 2147483647. A Java literal for it needs L."}], "source": "Java fundamentals: Data Types."}, {"id": 6, "topic": "Data Types", "marks": 1, "prompt": "Select the smallest signed integral primitive type (byte, short, int or long) that can store the mathematical integer -128. This is a range question, not a Java-literal declaration.", "code": "", "fields": [{"label": "Select one", "answer": "byte", "options": ["int", "byte", "long", "short"], "explanation": "-128 is exactly the byte minimum; it is not out of range."}], "source": "Java fundamentals: Data Types."}, {"id": 7, "topic": "Data Types", "marks": 1, "prompt": "Select the smallest signed integral primitive type (byte, short, int or long) that can store the mathematical integer 32767. This is a range question, not a Java-literal declaration.", "code": "", "fields": [{"label": "Select one", "answer": "short", "options": ["byte", "short", "int", "long"], "explanation": "32767 is exactly the short maximum; byte is too small."}], "source": "Java fundamentals: Data Types."}, {"id": 8, "topic": "Data Types", "marks": 1, "prompt": "Select the smallest signed integral primitive type (byte, short, int or long) that can store the mathematical integer 2147483647. This is a range question, not a Java-literal declaration.", "code": "", "fields": [{"label": "Select one", "answer": "int", "options": ["long", "byte", "int", "short"], "explanation": "2147483647 is exactly the int maximum."}], "source": "Java fundamentals: Data Types."}, {"id": 9, "topic": "Data Types", "marks": 1, "prompt": "Which primitive type represents the values true and false?", "code": "", "fields": [{"label": "Select one", "answer": "boolean", "options": ["boolean", "String", "double", "short", "float", "char", "byte", "long", "int"], "explanation": "boolean has the two values true and false; it is not an integer type."}], "source": "Java fundamentals: Data Types."}, {"id": 10, "topic": "Data Types", "marks": 1, "prompt": "Which primitive type is the type of the Java literal 'G'?", "code": "", "fields": [{"label": "Select one", "answer": "char", "options": ["short", "char", "byte", "long", "int", "double", "float", "String", "boolean"], "explanation": "Single quotes enclose a char literal; char is a 16-bit unsigned UTF-16 code unit."}], "source": "Java fundamentals: Data Types."}, {"id": 11, "topic": "Data Types", "marks": 1, "prompt": "Which type is the type of the Java literal 12.5f?", "code": "", "fields": [{"label": "Select one", "answer": "float", "options": ["boolean", "float", "int", "short", "String", "long", "double", "char", "byte"], "explanation": "The f suffix makes this literal float. Without a suffix, a decimal floating-point literal is double."}], "source": "Java fundamentals: Data Types."}, {"id": 12, "topic": "Data Types", "marks": 1, "prompt": "Which type is the type of the Java literal \"Galway\"?", "code": "", "fields": [{"label": "Select one", "answer": "String", "options": ["double", "int", "short", "char", "long", "String", "byte", "float", "boolean"], "explanation": "Double quotes create a String literal. String is a reference type, not a primitive."}], "source": "Java fundamentals: Data Types."}, {"id": 13, "topic": "Declaring Variables", "marks": 2, "prompt": "Complete the declaration. For integral values choose the smallest signed integral type. For floating-point values choose the smallest floating-point type that accepts this exact literal without a cast. Select the only legal identifier offered.", "code": "[A] [B] = -97;", "fields": [{"label": "[A] Type", "answer": "byte", "options": ["long", "byte", "double", "float", "String", "int", "short", "boolean", "char"], "expla ] j = 480000;\n        [C] k = j * 0.25f;\n        System.out.println(\"k = \" + [D]);\n    }\n}", "fields": [{"label": "[A] Type of i", "answer": "byte", "options": ["float", "long", "boolean", "byte", "int", "String", "char", "short", "double"], "explanation": "-116 fits byte."}, {"label": "[B] Type of j", "answer": "int", "options": ["short", "long", "float", "String", "char", "byte", "boolean", "double", "int"], "explanation": "480000 exceeds short range and fits int."}, {"label": "[C] Type of k", "answer": "float", "options": ["int", "boolean", "float", "double", "short", "byte", "char", "String", "long"], "explanation": "j is int and 0.25f is float; binary numeric promotion makes their product float. double could store it but is not the requested expression type."}, {"label": "[D] Printed variable", "answer": "k", "options": ["i", "null", "j", "k"], "explanation": "The requested result is stored in k, not either input."}], "source": "Java fundamentals: Assigning Types to Variables."}, {"id": 24, "topic": "Assigning Types to Variables", "marks": 8, "prompt": "Choose the smallest signed integral type for count. For ratio and truncated choose the exact expression type. For text choose the type of the assigned literal.", "code": "public class TypesTwo {\n    public static void main(String[] args) {\n        [A] count = 30000;\n        [B] ratio = count / 4.0;\n        [C] truncated = (int) 7.9;\n        [D] text = \"JAVA\";\n    }\n}", "fields": [{"label": "[A] Type of count", "answer": "short", "options": ["boolean", "char", "String", "short", "float", "byte", "long", "int", "double"], "explanation": "30000 is too large for byte and fits short."}, {"label": "[B] Type of ratio", "answer": "double", "options": ["int", "short", "float", "byte", "String", "char", "long", "boolean", "double"], "explanation": "The unsuffixed 4.0 literal is double, so count / 4.0 has type double."}, {"label": "[C] Type of truncated", "answer": "int", "options": ["float", "short", "long", "boolean", "char", "double", "byte", "String", "int"], "explanation": "The explicit (int) cast produces int, discarding the fractional part toward zero."}, {"label": "[D] Type of text", "answer": "String", "options": ["char", "long", "int", "short", "boolean", "float", "String", "byte", "double"], "explanation": "The double-quoted literal is a String, not a char."}], "source": "Java fundamentals: Assigning Types to Variables."}, {"id": 25, "topic": "Evaluating Expressions", "marks": 10, "prompt": "Evaluate each expression as Java boolean true or false. Character literals use their numeric UTF-16 values in numeric comparisons. Each expression is independent; use the supplied String declarations where needed.", "code": "[A] !true || !('A' \u003c 30 || true)\n[B] (48 \u003c= 20) && (7 * 9 >= 60)\n[C] (-3 \u003c 'Z') && !('F' + 1 \u003c 40)\n[D] !(false || 90 - 10 >= 'B')\n[E] !('L' > 65) || !(!false)", "fields": [{"label": "[A] !true || !('A' \u003c 30 || true)", "answer": "false", "options": ["false", "true"], "explanation": "!true is false; the inner OR is true, whose negation is false. false || false is false."}, {"label": "[B] (48 \u003c= 20) && (7 * 9 >= 60)", "answer": "false", "options": ["false", "true"], "explanation": "The first comparison is false, so && produces false (and short-circuits)."}, {"label": "[C] (-3 \u003c 'Z') && !('F' + 1 \u003c 40)", "answer": "true", "options": ["true", "false"], "explanation": "'Z' is 90 and 'F' is 70. -3 \u003c 90 is true; 71 \u003c 40 is false, negated to true."}, {"label": "[D] !(false || 90 - 10 >= 'B')", "answer": "false", "options": ["true", "false"], "explanation": "90 - 10 is 80; 'B' is 66. The comparison is true, so the outer negation gives false."}, {"label": "[E] !('L' > 65) || !(!false)", "answer": "false", "options": ["false", "true"], "explanation": "'L' is 76: !(76 > 65) is false. !(!false) is false. Both sides are false."}], "source": "Java fundamentals: Evaluating Expressions."}, {"id": 26, "topic": "Evaluating Expressions", "marks": 10, "prompt": "Evaluate each expression as Java boolean true or false. Character literals use their numeric UTF-16 values in numeric comparisons. Each expression is independent; use the supplied String declarations where needed.", "code": "String first = new String(\"Cork\");\nString second = new String(\"Cork\");\nString same = first;\n\n[A] 2 + 3 * 4 == 14\n[B] 7 / 2 == 3.5\n[C] 'A' + 2 == 'C'\n[D] (true || false) && !true\n[E] same == first && first.equals(second) && first != second", "fields": [{"label": "[A] 2 + 3 * 4 == 14", "answer": "true", "options": ["false", "true"], "explanation": "Multiplication precedes addition: 2 + 12 equals 14."}, {"label": "[B] 7 / 2 == 3.5", "answer": "false", "options": ["false", "true"], "explanation": "7 / 2 uses integer division and yields 3. The subsequent comparison promotes 3 to double; 3.0 is not 3.5."}, {"label": "[C] 'A' + 2 == 'C'", "answer": "true", "options": ["true", "false"], "explanation": "char operands undergo numeric promotion: 65 + 2 equals 67, the value of 'C'."}, {"label": "[D] (true || false) && !true", "answer": "false", "options": ["true", "false"], "explanation": "The OR is true, but !true is false. true && false is false."}, {"label": "[E] same == first && first.equals(second) && first != second", "answer": "true", "options": ["true", "false"], "explanation": "same and first refer to the same object. The two explicitly constructed Strings have equal text but different references."}], "source": "Java fundamentals: Evaluating Expressions."}, {"id": 27, "topic": "Create a Class and Call a Method", "marks": 8, "prompt": "Complete the class. The field must be accessible only inside this class (encapsulation). The constructor must be public. Construct using the float literal 12.5f, then invoke the instance method with the exact arguments 3 and 2.0d.", "code": "public class Gadget {\n    [A] float size;\n    [B] Gadget(float size) { this.size = size; }\n    public double play(int amount, double divisor) {\n        return (size - amount) / divisor;\n    }\n    public static void main(String[] args) {\n        Gadget g = [C];\n        double result = [D];\n    }\n}", "fields": [{"label": "[A] Field access", "answer": "private", "options": ["private", "protected", "public", "secured"], "explanation": "private restricts direct field access to this class in this simple top-level example; other modifiers may compile but do not meet the stated requirement."}, {"label": "[B] Constructor access", "answer": "public", "options": ["available", "protected", "public", "private"], "explanation": "The prompt explicitly requires a public constructor; same-class invocation alone would not require public."}, {"label": "[C] Construction", "answer": "new Gadget(12.5f)", "options": ["new Gadget(12.5d)", "Gadget(12.5f)", "new Gadget(12.5f)", "new Gadget()"], "explanation": "new invokes the constructor. Its float parameter accepts 12.5f; a double would require narrowing, and no zero-argument constructor is declared."}, {"label": "[D] Invocation", "answer": "g.play(3, 2.0d)", "options": ["g.play(3)", "g.play(3, 2.0d)", "g.play(3.0d, 2)", "play(3, 2.0d)"], "explanation": "The nonstatic play method needs receiver g and arguments matching int, double. A direct unqualified call from static main has no instance receiver."}], "source": "Java fundamentals: Create a Class and Call a Method."}, {"id": 28, "topic": "Create a Class and Call a Method", "marks": 8, "prompt": "Complete the class. Keep the field private. The constructor must be public; its body must update the field from its parameter. Construct one Car with 40 litres and call its instance method with the int argument 5.", "code": "public class Car {\n    private int fuel;\n    [A] Car(int litres) { [B] = litres; }\n    public int remaining(int used) { return fuel - used; }\n    public static void main(String[] args) {\n        Car car = [C];\n        int result = [D];\n    }\n}", "fields": [{"label": "[A] Construc function tick(){if(expired()){finish(true,'timeout');return;}const timer=document.getElementById('timer');if(!timer||!state.timed||state.submitted)return;const seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));timer.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;timer.classList.toggle('urgent',seconds<=300);}
function renderResults(){const result=score();root.innerHTML=`<section class="panel"><div class="topline"><h1>Practice results</h1><span class="tag">${state.submissionReason==='timeout'?'Automatically submitted — time expired':'Attempt submitted'}</span></div><p class="score">${fmt(result.earned)} / 164 <span class="tag">(${fmt(result.percentage)}%)</span></p><p>Practice scoring only: each question’s marks are divided equally between its fields. No negative marking. Displayed figures are rounded to two decimal places.</p><div class="actions"><button data-action="export">Export attempt JSON</button><button data-action="retry" class="primary">Retry with a fresh attempt</button></div><h2 style="margin-top:24px">Topic breakdown</h2><div class="table-wrap"><table><thead><tr><th scope="col">Topic</th><th scope="col">Marks</th><th scope="col">Percentage</th></tr></thead><tbody>${Object.entries(result.topics).map(([topic,t])=>`<tr><th scope="row">${esc(topic)}</th><td>${fmt(t.earned)} / ${t.possible}</td><td>${fmt(t.earned/t.possible*100)}%</td></tr>`).join('')}</tbody></table></div></section>${QUESTIONS.map((q,index)=>{const r=result.questions[index];return `<article class="panel review"><h2>Question ${q.id} · ${fmt(r.earned)} / ${q.marks} marks</h2><p class="tag">${esc(q.topic)}</p><p class="prompt">${esc(q.prompt)}</p>${q.code!==undefined?`<pre><code>${esc(q.code)}</code></pre>`:''}${q.fields.map((f,i)=>`<div class="review-field"><h3>${esc(f.label)}</h3><p class="${answer(q,i)===f.answer?'correct':'incorrect'}"><strong>Your answer:</strong> ${esc(answer(q,i)||'Not answered')}</p><p><strong>Correct answer:</strong> ${esc(f.answer)}</p><p class="prompt">${esc(f.explanation)}</p></div>`).join('')}<p class="muted source"><strong>Topic:</strong> ${esc(q.source)}</p></article>`;}).join('')}`;}
function exportAttempt(){if(!state.submitted)return;const payload={simulator:'Java Fundamentals Quiz',version:VERSION,exportedAt:new Date().toISOString(),attempt:JSON.parse(JSON.stringify(state)),marks:score()};delete payload.attempt.bank;const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='oop-java-practice-attempt.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function retry(){if(!confirm('Discard this saved attempt and all answers, and start again? Export your results first if you want to keep them.'))return;try{localStorage.removeItem(KEY);}catch(e){storageNotice('The browser could not clear the saved attempt. Close this page only after exporting any results you need.');}state=emptyState();selectedToken=null;view='setup';render(true);}
root.addEventListener('change',event=>{const input=event.target.closest('[data-field]');if(!input)return;const q=QUESTIONS[state.current];const i=Number(input.dataset.field);updateField(i,input.value===''?'':q.fields[i].options[Number(input.value)]);});
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.go!==undefined){go(button.dataset.go);return;}if(button.dataset.token!==undefined){const q=QUESTIONS[state.current];const tokens=[...new Set(q.fields.flatMap(f=>f.options))];selectedToken=tokens[Number(button.dataset.token)];root.querySelectorAll('[data-token]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));announce('Token selected. Choose an answer slot.');return;}if(button.dataset.slot!==undefined){if(selectedToken===null){document.getElementById('field-'+button.dataset.slot)?.focus();announce('Choose an answer from this field’s options or selection list.');return;}const i=Number(button.dataset.slot);updateField(i,selectedToken);root.querySelector(`[data-slot="${i}"]`)?.focus();return;}switch(button.dataset.action){case 'start':start();break;case 'flag':if(expired()){finish(true,'timeout');break;}state.flags[QUESTIONS[state.current].id]=!state.flags[QUESTIONS[state.current].id];save();renderExam();tick();root.querySelector('[data-action="flag"]')?.focus();break;case 'clear':if(expired()){finish(true,'timeout');break;}delete state.answers[QUESTIONS[state.current].id];save();renderExam();tick();root.querySelector('[data-action="clear"]')?.focus();announce('Answers cleared.');break;case 'previous':go(state.current-1);break;case 'next':if(state.current===QUESTIONS.length-1)finish();else go(state.current+1);break;case 'summary':finish();break;case 'return':go(state.current);break;case 'submit':finish(true);break;case 'export':exportAttempt();break;case 'retry':retry();break;}});
root.addEventListener('dragstart',event=>{const token=event.target.closest('[data-token]');if(!token)return;event.dataTransfer.setData('text/plain',token.textContent);event.dataTransfer.effectAllowed='copy';});
root.addEventListener('dragover',event=>{if(event.target.closest('[data-slot]')){event.preventDefault();event.dataTransfer.dropEffect='copy';}});
root.addEventListener('drop',event=>{const slot=event.target.closest('[data-slot]');if(!slot)return;event.preventDefault();const i=Number(slot.dataset.slot);updateField(i,event.dataTransfer.getData('text/plain'));root.querySelector(`[data-slot="${i}"]`)?.focus();});
document.addEventListener('visibilitychange',tick);
window.addEventListener('pageshow',tick);
window.quizApp={start,go,finish,score,get state(){return state;},get questions(){return QUESTIONS;}};
if(!Array.isArray(QUESTIONS)||QUESTIONS.length!==37||QUESTIONS.reduce((n,q)=>n+q.marks,0)!==TOTAL||QUESTIONS.some((q,i)=>q.id!==i+1||!Number.isFinite(q.marks)||q.marks<=0||!Array.isArray(q.fields)||!q.fields.length||q.fields.some(f=>!Array.isArray(f.options)||!f.options.length||!f.options.includes(f.answer)))){root.innerHTML='<section class="panel"><h1>Question bank unavailable</h1><p>This simulator requires 37 numbered questions totalling 164 marks, with a valid answer for every field. Please check the question data.</p></section>';return;}
restore();render();setInterval(tick,1000);
})();
</script>
</body>
</html>
